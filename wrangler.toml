name = "ompatel"
main = ".open-next/worker.js"
compatibility_date = "2026-03-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# TTC Pulse Ask chat. Rate limits are for each colo and are approximate: a brake, not a meter.
[[ratelimits]]
name = "CHAT_VISITOR_LIMIT"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "CHAT_GLOBAL_LIMIT"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "CHAT_ESCALATE_LIMIT"
namespace_id = "1003"
simple = { limit = 2, period = 60 }

# One binding has one limit, so the visitor escalation limit (1 a minute) needs its own binding.
[[ratelimits]]
name = "CHAT_ESCALATE_VISITOR_LIMIT"
namespace_id = "1004"
simple = { limit = 1, period = 60 }

# The daily answer cap for the chat. The class lives in the Worker "ompatel-chat-budget" (workers/chat-budget).
# Deploy that Worker first. This Worker needs no Durable Object migration.
[[durable_objects.bindings]]
name = "CHAT_BUDGET"
class_name = "ChatBudget"
script_name = "ompatel-chat-budget"

# Workers logs also keep the chat answer and vote logs. Free plan: 200,000 log lines a day, kept 3 days.
[observability]
enabled = true

# Chat answer and vote logs. Free plan: 100,000 data points a day.
# Analytics Engine must be enabled once in the dashboard (Workers, Analytics Engine) before these lines work.
# Until then, the logs go to Workers logs. After you enable it, remove the # from the 3 lines below.
# [[analytics_engine_datasets]]
# binding = "CHAT_ANALYTICS"
# dataset = "ttc_chat"
